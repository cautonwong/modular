name: Embedded Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex-m4-qemu:
    name: Cortex-M4 + QEMU peripheral IRQ smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-m4-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-m4-ccache-
      - name: Install ARM GNU toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi qemu-system-arm ccache
      - name: Verify tools
        run: |
          arm-none-eabi-gcc --version
          qemu-system-arm --version
          qemu-system-arm -machine help | grep -E '^mps2-an386'
      - name: Set reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Configure Cortex-M4 QEMU firmware
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build-m4 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.github/arm/arm-none-eabi.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DEDGE_MODULE_BUILD_ARM_CORTEX_M4_QEMU=ON \
            -DEDGE_MODULE_ARM_QEMU_SEMIHOSTING=ON \
            -DEDGE_MODULE_BUILD_TESTS=OFF \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF \
            -DEDGE_MODULE_ENABLE_WERROR=ON
      - name: Build Cortex-M4 QEMU ELF and binary
        run: cmake --build build-m4 --parallel
      - name: Verify Cortex-M4 QEMU ELF
        run: |
          arm-none-eabi-readelf -h build-m4/meter_mps2_fw | tee build-m4/readelf.txt
          grep -E 'Class:.*ELF32' build-m4/readelf.txt
          grep -E 'Machine:.*ARM' build-m4/readelf.txt
          entry=$(awk '/Entry point address/{print $NF}' build-m4/readelf.txt)
          python3 -c "e=int('$entry',16); assert 0 < e < 0x10000, f'entry {e:#x} outside low flash'; print(f'Cortex-M4 entry in low flash: {e:#x}')"
          arm-none-eabi-size build-m4/meter_mps2_fw
          python3 .github/scripts/check_size.py build-m4/meter_mps2_fw 65536 16384
          python3 .github/scripts/check_map_budget.py build-m4/meter_mps2_fw.map \
            --report build-m4/size-report.json
      - name: Zero dynamic memory check
        env:
          NM_TOOL: arm-none-eabi-nm
        run: python3 .github/scripts/check_no_dynamic_memory.py build-m4/meter_mps2_fw
      - name: Static stack usage gate
        run: |
          python3 .github/scripts/check_stack_usage.py build-m4 \
            --max-bytes 512 --exclude-substr /product/ \
            --report build-m4/stack-report.json
      - name: QEMU MPS2 AN386 peripheral IRQ smoke
        run: |
          # The firmware exits 0 only when the TIMER0 interrupt delivered the
          # event; 8 means the loop finished without it. Assert, so a hang and a
          # silent "no IRQ" cannot both count as success.
          rc=0
          timeout --signal=KILL 10s \
            qemu-system-arm \
              -M mps2-an386 \
              -nographic \
              -semihosting-config enable=on,target=native \
              -kernel build-m4/meter_mps2_fw || rc=$?
          echo "firmware exit status: $rc"
          test "$rc" -eq 0
      - name: Upload Cortex-M4 QEMU image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-m4-qemu-firmware
          path: |
            build-m4/meter_mps2_fw
            build-m4/meter_mps2_fw.bin
            build-m4/meter_mps2_fw.map
            build-m4/size-report.json
            build-m4/stack-report.json
            build-m4/readelf.txt
          if-no-files-found: error

  riscv32-qemu:
    name: RISC-V 32 + QEMU (virt) smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-rv-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rv-ccache-
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            qemu-system-misc ccache
      - name: Verify tools
        run: |
          riscv64-unknown-elf-gcc --version
          qemu-system-riscv32 --version
          qemu-system-riscv32 -machine help | grep -E '^virt'
      - name: Set reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Configure RISC-V firmware
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build-rv -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/riscv-elf.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DEDGE_MODULE_BUILD_RISCV32_QEMU=ON \
            -DEDGE_MODULE_BUILD_TESTS=OFF \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF \
            -DEDGE_MODULE_ENABLE_WERROR=ON
      - name: Build RISC-V ELF and binary
        run: cmake --build build-rv --parallel
      - name: Verify RISC-V ELF
        env:
          SIZE_TOOL: riscv64-unknown-elf-size
        run: |
          riscv64-unknown-elf-readelf -h build-rv/riscv_meter | tee build-rv/readelf.txt
          grep -E 'Class:.*ELF32' build-rv/readelf.txt
          grep -E 'Machine:.*RISC-V' build-rv/readelf.txt
          riscv64-unknown-elf-size build-rv/riscv_meter
          python3 .github/scripts/check_size.py build-rv/riscv_meter 65536 16384
          python3 .github/scripts/check_map_budget.py build-rv/riscv_meter.map \
            --report build-rv/size-report.json
      - name: Zero dynamic memory check
        env:
          NM_TOOL: riscv64-unknown-elf-nm
        run: python3 .github/scripts/check_no_dynamic_memory.py build-rv/riscv_meter
      - name: Static stack usage gate
        run: |
          python3 .github/scripts/check_stack_usage.py build-rv \
            --max-bytes 512 --exclude-substr /product/ \
            --report build-rv/stack-report.json
      - name: QEMU virt RISC-V timer IRQ smoke
        run: |
          timeout --signal=KILL 10s \
            qemu-system-riscv32 -M virt -nographic -bios none -kernel build-rv/riscv_meter
      - name: Upload RISC-V QEMU image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riscv32-qemu-firmware
          path: |
            build-rv/riscv_meter
            build-rv/riscv_meter.bin
            build-rv/riscv_meter.map
            build-rv/size-report.json
            build-rv/stack-report.json
            build-rv/readelf.txt
          if-no-files-found: error

  freertos-qemu:
    name: FreeRTOS host + QEMU smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler and FreeRTOS kernel caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/.fetchcontent
          key: ${{ runner.os }}-freertos-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-freertos-
      - name: Install ARM GNU toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi qemu-system-arm ccache
      - name: Verify tools
        run: |
          arm-none-eabi-gcc --version
          qemu-system-arm --version
      - name: Set reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Configure FreeRTOS-hosted firmware
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build-freertos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.github/arm/arm-none-eabi.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fetchcontent \
            -DEDGE_MODULE_BUILD_FREERTOS_QEMU=ON \
            -DEDGE_MODULE_BUILD_TESTS=OFF \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF \
            -DEDGE_MODULE_ENABLE_WERROR=ON
      - name: Build FreeRTOS firmware
        run: cmake --build build-freertos --parallel
      - name: Verify and budget FreeRTOS image
        env:
          SIZE_TOOL: arm-none-eabi-size
        run: |
          arm-none-eabi-readelf -h build-freertos/meter_mps2_freertos_fw | tee build-freertos/readelf.txt
          grep -E 'Class:.*ELF32' build-freertos/readelf.txt
          grep -E 'Machine:.*ARM' build-freertos/readelf.txt
          arm-none-eabi-size build-freertos/meter_mps2_freertos_fw
          python3 .github/scripts/check_size.py build-freertos/meter_mps2_freertos_fw 65536 16384
          python3 .github/scripts/check_map_budget.py build-freertos/meter_mps2_freertos_fw.map \
            --report build-freertos/size-report.json
      - name: Zero dynamic memory check
        env:
          NM_TOOL: arm-none-eabi-nm
        run: python3 .github/scripts/check_no_dynamic_memory.py build-freertos/meter_mps2_freertos_fw
      - name: Static stack usage gate
        run: |
          python3 .github/scripts/check_stack_usage.py build-freertos \
            --max-bytes 512 --exclude-substr /product/ --exclude-substr /_deps/ \
            --report build-freertos/stack-report.json
      - name: QEMU FreeRTOS capsule smoke
        run: |
          # The firmware now exits with a real status (SYS_EXIT_EXTENDED): 0 means
          # the TIMER0 interrupt delivered the event through the guarded sink, and
          # 9 means the kernel asserted (e.g. an IRQ above the syscall ceiling).
          rc=0
          timeout --signal=KILL 15s \
            qemu-system-arm \
              -M mps2-an386 \
              -nographic \
              -semihosting-config enable=on,target=native \
              -kernel build-freertos/meter_mps2_freertos_fw || rc=$?
          echo "firmware exit status: $rc"
          test "$rc" -eq 0
      - name: Upload FreeRTOS image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freertos-qemu-firmware
          path: |
            build-freertos/meter_mps2_freertos_fw
            build-freertos/meter_mps2_freertos_fw.bin
            build-freertos/meter_mps2_freertos_fw.map
            build-freertos/size-report.json
            build-freertos/stack-report.json
            build-freertos/readelf.txt
          if-no-files-found: error
