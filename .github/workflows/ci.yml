name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; individual jobs opt into more if ever required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  # Classify the change set so a pure documentation change does not pay for the
  # whole compile/QEMU matrix. Conservative by design: anything that is not
  # docs/** or *.md counts as code, and pushes to main always verify everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the change set
        id: classify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: verifying everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "changed files:"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "documentation-only change: taking the fast path"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: build-test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-debug, cc: gcc, build_type: Debug, sanitizer: OFF }
          - { name: gcc-release, cc: gcc, build_type: Release, sanitizer: OFF }
          - { name: clang-debug, cc: clang, build_type: Debug, sanitizer: OFF }
          - { name: clang-release, cc: clang, build_type: Release, sanitizer: OFF }
          - { name: gcc-asan-ubsan, cc: gcc, build_type: Debug, sanitizer: ON }
          - { name: clang-asan-ubsan, cc: clang, build_type: Debug, sanitizer: ON }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libcmocka-dev ccache
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.cc }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.cc }}-${{ matrix.build_type }}-
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DEDGE_MODULE_ENABLE_WERROR=ON \
            -DEDGE_MODULE_ENABLE_SANITIZERS=${{ matrix.sanitizer }} \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build --output-on-failure --parallel 2 \
            --output-junit test-results.xml
      - name: Compiler cache stats
        if: always()
        run: ccache --show-stats || true
      - name: Product size gate
        if: matrix.name == 'gcc-release'
        run: |
          test -f build/example
          size build/example
          python3 .github/scripts/check_size.py build/example 65536 16384
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: build/test-results.xml
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/Testing/
            build/compile_commands.json
          if-no-files-found: ignore

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libcmocka-dev gcovr
      - name: Configure
        env:
          CC: gcc
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEDGE_MODULE_ENABLE_COVERAGE=ON \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --parallel 2 \
            --output-junit test-results.xml
      - name: Coverage report and gate
        run: |
          gcovr --root . --object-directory build \
            --filter 'edge_module/' \
            --filter 'sys/' \
            --filter 'app/' \
            --filter 'infra/' \
            --filter 'pal/' \
            --filter 'product/.*/glue\.c$' \
            --exclude 'tests/' \
            --fail-under-line 95 \
            --txt --xml-pretty --xml coverage.xml \
            --html-details coverage.html
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.html
            test-results.xml
          if-no-files-found: ignore

  product-matrix:
    name: product-matrix
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libcmocka-dev
      - name: Build all legal products
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEDGE_MODULE_ENABLE_WERROR=ON \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
          cmake --build build --parallel
      - name: Run host products
        run: |
          for product in example meter_host meter_mps2 meter_gateway_host; do
            echo "running $product"
            ./build/$product
          done
      - name: Reject illegal family/board/app/infra combinations
        run: |
          for negative in family board app infra combo rebind duplicate; do
            echo "--- negative case: $negative ---"
            if cmake -S . -B "/tmp/neg-$negative" -G Ninja \
                 -DEDGE_MODULE_NEGATIVE_CASE=$negative \
                 -DEDGE_MODULE_BUILD_TESTS=OFF \
                 -DEDGE_MODULE_BUILD_EXAMPLE=OFF >"/tmp/neg-$negative.log" 2>&1; then
              echo "expected configure to fail for $negative"
              exit 1
            fi
            case "$negative" in
              combo) grep -q "illegal family/board" "/tmp/neg-$negative.log" ;;
              rebind|duplicate) grep -q "already registered" "/tmp/neg-$negative.log" ;;
              *) grep -q "unknown $negative" "/tmp/neg-$negative.log" ;;
            esac
          done

  neutrality:
    name: neutrality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libcmocka-dev
      - name: Configure host matrix
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEDGE_MODULE_ENABLE_WERROR=ON \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build board x runner matrix (same app)
        run: cmake --build build --parallel
      - name: Run baremetal and RTOS-like runners
        run: |
          ./build/minimal_host_baremetal
          ./build/minimal_host_thread
      - name: App must be unchanged by any variant
        run: |
          git diff --exit-code -- app/
          test -z "$(git status --porcelain app/)"

  cross-compile-arm:
    name: cross-compile (Cortex-M0)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-arm-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arm-ccache-
      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi ccache
      - name: Verify target toolchain
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-size --version
      - name: Set reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Configure Cortex-M0 target
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build-arm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.github/arm/arm-none-eabi.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DEDGE_MODULE_BUILD_ARM_CORTEX_M0=ON \
            -DEDGE_MODULE_BUILD_TESTS=OFF \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF \
            -DEDGE_MODULE_ENABLE_WERROR=ON
      - name: Build Cortex-M0 ELF and binary
        run: cmake --build build-arm --parallel
      - name: Verify target ELF architecture
        run: |
          arm-none-eabi-readelf -h build-arm/example_cortex_m0 | tee build-arm/readelf.txt
          grep -E 'Class:.*ELF32' build-arm/readelf.txt
          grep -E 'Machine:.*ARM' build-arm/readelf.txt
      - name: Target Flash/RAM size gate
        env:
          SIZE_TOOL: arm-none-eabi-size
        run: |
          arm-none-eabi-size build-arm/example_cortex_m0
          python3 .github/scripts/check_size.py build-arm/example_cortex_m0 65536 16384
      - name: Map-level layer budget
        run: |
          python3 .github/scripts/check_map_budget.py build-arm/example_cortex_m0.map \
            --report build-arm/size-report.json
      - name: Size trend against the recorded baseline
        run: |
          python3 .github/scripts/report_size_trend.py build-arm/size-report.json \
            --target example_cortex_m0 \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Zero dynamic memory check
        env:
          NM_TOOL: arm-none-eabi-nm
        run: python3 .github/scripts/check_no_dynamic_memory.py build-arm/example_cortex_m0
      - name: Static stack usage gate
        run: |
          python3 .github/scripts/check_stack_usage.py build-arm \
            --max-bytes 512 --exclude-substr /product/ \
            --report build-arm/stack-report.json
      - name: Reproducible firmware check
        run: |
          cmake -S . -B build-arm-repro -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.github/arm/arm-none-eabi.cmake \
            -DEDGE_MODULE_BUILD_ARM_CORTEX_M0=ON \
            -DEDGE_MODULE_BUILD_TESTS=OFF \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF
          cmake --build build-arm-repro --parallel
          sha256sum build-arm/example_cortex_m0.bin build-arm-repro/example_cortex_m0.bin
          cmp build-arm/example_cortex_m0.bin build-arm-repro/example_cortex_m0.bin
      - name: Generate provenance metadata and SBOM
        run: |
          CC=arm-none-eabi-gcc python3 .github/scripts/generate_build_metadata.py build-arm/build-metadata.json
          CC=arm-none-eabi-gcc python3 .github/scripts/generate_sbom.py build-arm/sbom.cdx.json
          (cd build-arm && sha256sum example_cortex_m0 example_cortex_m0.bin > SHA256SUMS)
          cat build-arm/build-metadata.json
      - name: Upload target image and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-m0-firmware
          path: |
            build-arm/example_cortex_m0
            build-arm/example_cortex_m0.bin
            build-arm/example_cortex_m0.map
            build-arm/readelf.txt
            build-arm/SHA256SUMS
            build-arm/build-metadata.json
            build-arm/sbom.cdx.json
          if-no-files-found: error

  static-analysis:
    name: static-analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libcmocka-dev \
            clang clang-tidy clang-format cppcheck
      - name: Configure
        env:
          CC: clang
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEDGE_MODULE_ENABLE_WERROR=ON \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Toolchain manifest matches the installed tools
        run: python3 .github/scripts/check_toolchain.py
      - name: Formatting check
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror
      - name: clang-tidy
        run: |
          clang-tidy -p build \
            edge_module/src/event.c \
            sys/runtime/src/sys.c \
            sys/example/sys_example.c \
            sys/meter/sys_meter.c \
            app/dlt645/src/dlt645.c \
            app/relay/src/relay.c \
            app/modbus_slave/src/modbus_slave.c \
            app/meter_core/src/meter_core.c \
            infra/flash/src/flash.c \
            infra/gpio/src/gpio.c \
            infra/uart/src/uart.c \
            board/example/src/board.c \
            board/mps2/src/board.c \
            pal/host/src/host.c \
            pal/os/src/idle.c
      - name: cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 --inline-suppr \
            -i tests/guards \
            -I edge_module/include \
            -I sys/runtime/include \
            -I sys/example/include \
            -I sys/meter/include \
            -I app/dlt645/include \
            -I app/relay/include \
            -I app/modbus_slave/include \
            -I app/meter_core/include \
            -I infra/flash/include \
            -I infra/gpio/include \
            -I infra/uart/include \
            -I board/example/include \
            -I board/mps2/include \
            -I soc/mps2/include \
            -I pal/host/include \
            -I pal/os/include \
            -I pal/rtos/include \
            edge_module sys app board infra pal product tests

  architecture:
    name: architecture-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Application dependency boundary
        run: python3 .github/scripts/check_app_isolation.py
      - name: App transitive include boundary
        run: python3 .github/scripts/check_app_transitive_includes.py
      - name: Layer dependency direction
        run: python3 .github/scripts/check_layer_dependencies.py
      - name: Central event ID uniqueness
        run: python3 .github/scripts/check_event_ids.py
      - name: Central module ID uniqueness
        run: python3 .github/scripts/check_module_ids.py
      - name: Product-to-board binding (D86)
        run: python3 .github/scripts/check_product_board_binding.py
      - name: Central error ID uniqueness
        run: python3 .github/scripts/check_error_ids.py
      - name: Event payload scalar check
        run: python3 .github/scripts/check_event_payload.py
      - name: ADR gate coverage
        run: python3 .github/scripts/check_adr_gates.py
      - name: CMake/main product consistency
        run: python3 .github/scripts/check_cmake_apps.py
      - name: Area registration (D88)
        run: python3 .github/scripts/check_area_registration.py
      - name: Guard self-test (negative fixtures)
        run: python3 tests/guards/run_guard_selftest.py
      - name: Guard coverage (every checker has a refutation fixture)
        run: python3 .github/scripts/check_guard_coverage.py
      - name: CI artifact generators (smoke)
        run: python3 tests/guards/run_generator_selftest.py
      - name: Pre-commit hook is present and valid
        run: |
          test -x .githooks/pre-commit
          sh -n .githooks/pre-commit
          test -x .githooks/commit-msg
          sh -n .githooks/commit-msg
          test -x .githooks/pre-push
          sh -n .githooks/pre-push
      - name: Documentation format and links
        run: python3 .github/scripts/check_docs.py
      - name: Commit messages (Conventional Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) RANGE="HEAD~1..HEAD" ;;
              *) RANGE="$BEFORE..${{ github.sha }}" ;;
            esac
          fi
          echo "commit range: $RANGE"
          python3 .github/scripts/check_commit_messages.py --range "$RANGE"
      - name: Forbidden RTOS/framework dependencies
        run: |
          if grep -RInE '#include[[:space:]]*["<](FreeRTOS|zephyr|cmsis_os|rtthread)' \
              app edge_module sys board infra product 2>/dev/null; then
            echo 'forbidden RTOS/framework dependency found'
            exit 1
          fi
      - name: Required layers
        run: |
          test -d edge_module
          test -d app
          test -d sys
          test -d board
          test -d infra
          test -d product

  ci-success:
    name: ci-success
    if: always()
    needs:
      - changes
      - build-test
      - coverage
      - product-matrix
      - neutrality
      - cross-compile-arm
      - static-analysis
      - architecture
    runs-on: ubuntu-24.04
    steps:
      # A documentation-only change legitimately skips the code-dependent jobs,
      # so `skipped` is acceptable for them. The architecture guards and the
      # change classifier itself must always succeed.
      - name: Require all quality gates
        run: |
          set -e
          test "${{ needs.changes.result }}" = success
          test "${{ needs.architecture.result }}" = success
          for gate in \
            "build-test:${{ needs.build-test.result }}" \
            "coverage:${{ needs.coverage.result }}" \
            "product-matrix:${{ needs.product-matrix.result }}" \
            "neutrality:${{ needs.neutrality.result }}" \
            "cross-compile-arm:${{ needs.cross-compile-arm.result }}" \
            "static-analysis:${{ needs.static-analysis.result }}"; do
            name="${gate%%:*}"
            result="${gate#*:}"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name was $result"; exit 1 ;;
            esac
          done
