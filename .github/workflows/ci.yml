name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-debug, cc: gcc, build_type: Debug, sanitizer: OFF }
          - { name: gcc-release, cc: gcc, build_type: Release, sanitizer: OFF }
          - { name: clang-debug, cc: clang, build_type: Debug, sanitizer: OFF }
          - { name: clang-release, cc: clang, build_type: Release, sanitizer: OFF }
          - { name: gcc-asan-ubsan, cc: gcc, build_type: Debug, sanitizer: ON }
          - { name: clang-asan-ubsan, cc: clang, build_type: Debug, sanitizer: ON }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcmocka-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEDGE_MODULE_ENABLE_WERROR=ON \
            -DEDGE_MODULE_ENABLE_SANITIZERS=${{ matrix.sanitizer }} \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Product size gate
        if: matrix.name == 'gcc-release'
        run: |
          test -f build/example
          size build/example
          python3 .github/scripts/check_size.py build/example 65536 16384
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/Testing/
            build/compile_commands.json
          if-no-files-found: ignore

  cross-compile-arm:
    name: cross-compile (Cortex-M0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Verify target toolchain
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-size --version
      - name: Configure Cortex-M0 target
        run: |
          cmake -S . -B build-arm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.github/arm/arm-none-eabi.cmake \
            -DEDGE_MODULE_BUILD_ARM_CORTEX_M0=ON \
            -DEDGE_MODULE_BUILD_TESTS=OFF \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF \
            -DEDGE_MODULE_ENABLE_WERROR=ON
      - name: Build Cortex-M0 ELF and binary
        run: cmake --build build-arm --parallel
      - name: Verify target ELF architecture
        run: |
          arm-none-eabi-readelf -h build-arm/example_cortex_m0 | tee build-arm/readelf.txt
          grep -E 'Class:.*ELF32' build-arm/readelf.txt
          grep -E 'Machine:.*ARM' build-arm/readelf.txt
      - name: Target Flash/RAM size gate
        env:
          SIZE_TOOL: arm-none-eabi-size
        run: |
          arm-none-eabi-size build-arm/example_cortex_m0
          python3 .github/scripts/check_size.py build-arm/example_cortex_m0 65536 16384
      - name: Upload target image and map
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m0-example
          path: |
            build-arm/example_cortex_m0
            build-arm/example_cortex_m0.bin
            build-arm/example_cortex_m0.map
            build-arm/readelf.txt

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcmocka-dev clang-tidy cppcheck
      - name: Configure
        env:
          CC: clang
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEDGE_MODULE_ENABLE_WERROR=ON \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: clang-tidy
        run: |
          clang-tidy -p build \
            edge_module/src/event.c \
            sys/example/src/sys.c \
            sys/example/sys_example.c \
            app/dlt645/src/dlt645.c \
            infra/flash/src/flash.c \
            board/example/src/board.c
      - name: cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 --inline-suppr \
            -I edge_module/include \
            -I app/dlt645/include \
            -I infra/flash/include \
            -I board/example/include \
            -I sys/example/include \
            edge_module sys app board infra product tests

  architecture:
    name: architecture-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Application dependency boundary
        run: python3 .github/scripts/check_app_isolation.py
      - name: Event ID uniqueness
        run: python3 .github/scripts/check_event_ids.py
      - name: Forbidden framework dependencies
        run: |
          if grep -RInE '#include[[:space:]]*["<](FreeRTOS|zephyr|cmsis_os|rtthread)' app edge_module 2>/dev/null; then
            echo 'forbidden RTOS/framework dependency found'
            exit 1
          fi
      - name: Required layers
        run: |
          test -d edge_module
          test -d app
          test -d sys
          test -d board
          test -d infra
          test -d product

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcmocka-dev gcovr
      - name: Configure
        env:
          CC: gcc
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEDGE_MODULE_ENABLE_COVERAGE=ON \
            -DEDGE_MODULE_BUILD_TESTS=ON \
            -DEDGE_MODULE_BUILD_EXAMPLE=OFF
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: |
          gcovr --root . --object-directory build \
            --filter 'edge_module/' \
            --filter 'sys/' \
            --exclude 'tests/' \
            --txt --xml-pretty --xml coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  ci-success:
    name: ci-success
    if: always()
    needs:
      - build-test
      - cross-compile-arm
      - static-analysis
      - architecture
      - coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Require all quality gates
        run: |
          test "${{ needs.build-test.result }}" = success
          test "${{ needs.cross-compile-arm.result }}" = success
          test "${{ needs.static-analysis.result }}" = success
          test "${{ needs.architecture.result }}" = success
          test "${{ needs.coverage.result }}" = success
