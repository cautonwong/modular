name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizer: OFF
            werror: ON
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizer: OFF
            werror: ON
          - name: clang-debug
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizer: OFF
            werror: ON
          - name: clang-release
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizer: OFF
            werror: ON
          - name: gcc-asan-ubsan
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizer: ON
            werror: ON
          - name: clang-asan-ubsan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizer: ON
            werror: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcmocka-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DEDGE_MODULE_ENABLE_WERROR=${{ matrix.werror }}
          -DEDGE_MODULE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
          -DEDGE_MODULE_BUILD_TESTS=ON
          -DEDGE_MODULE_BUILD_EXAMPLE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 2

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcmocka-dev clang-tidy cppcheck
      - name: Configure compile database
        env:
          CC: clang
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DEDGE_MODULE_BUILD_TESTS=ON
          -DEDGE_MODULE_BUILD_EXAMPLE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: clang-tidy
        run: clang-tidy -p build src/*.c
      - name: cppcheck
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr -I include src tests

  app-isolation:
    name: app-isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify application dependency boundary
        run: python3 .github/scripts/check_app_isolation.py
